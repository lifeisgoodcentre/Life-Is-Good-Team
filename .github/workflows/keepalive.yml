# Free Supabase projects pause after about a week without activity.
# This sends a tiny request every 3 days to help keep the database awake.
# If the project still pauses, restore it from the Supabase dashboard.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' js/config.js || true)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "js/config.js isn't filled in yet — nothing to ping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/settings?select=id" \
                   -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered with HTTP $code"
